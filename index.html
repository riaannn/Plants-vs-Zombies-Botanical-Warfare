<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | PvZ Botanic Warfare</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/pvz botanic test.loader.js";

      // Fetches multiple URLs and merges their ArrayBuffers into one Blob URL.
      // onProgress(loaded, total) is called as bytes arrive.
      function fetchAndMergeParts(urls, onProgress) {
        return Promise.all(
          urls.map(function(url) {
            return new Promise(function(resolve, reject) {
              var xhr = new XMLHttpRequest();
              xhr.open("GET", url, true);
              xhr.responseType = "arraybuffer";
              xhr.onprogress = function(e) {
                if (onProgress && e.lengthComputable) {
                  onProgress(url, e.loaded, e.total);
                }
              };
              xhr.onload = function() {
                if (xhr.status === 200 || xhr.status === 0) {
                  resolve(xhr.response);
                } else {
                  reject(new Error("Failed to fetch " + url + " (status " + xhr.status + ")"));
                }
              };
              xhr.onerror = function() { reject(new Error("Network error fetching " + url)); };
              xhr.send();
            });
          })
        ).then(function(buffers) {
          var merged = new Blob(buffers.map(function(b) { return new Uint8Array(b); }));
          return URL.createObjectURL(merged);
        });
      }

      // Track per-part progress so the loading bar reflects all three parts.
      var partProgress = {};
      function handlePartProgress(url, loaded, total) {
        partProgress[url] = { loaded: loaded, total: total };
        var totalLoaded = 0, totalSize = 0;
        Object.values(partProgress).forEach(function(p) {
          totalLoaded += p.loaded;
          totalSize   += p.total;
        });
        if (totalSize > 0) {
          // Reserve 0–50 % of the bar for the data merge step.
          progressBarFull.style.width = (50 * totalLoaded / totalSize) + "%";
        }
      }

      var dataParts = [
        buildUrl + "/pvz botanic test.data.unityweb.part1",
        buildUrl + "/pvz botanic test.data.unityweb.part2",
        buildUrl + "/pvz botanic test.data.unityweb.part3"
      ];

      loadingBar.style.display = "block";

      // 1. Merge the split data file, then 2. boot Unity with a blob: URL for it.
      fetchAndMergeParts(dataParts, handlePartProgress).then(function(mergedDataUrl) {

        var config = {
          arguments: [],
          dataUrl: mergedDataUrl,   // <-- merged blob replaces the original file
          frameworkUrl: buildUrl + "/pvz botanic test.framework.js.unityweb",
          codeUrl: buildUrl + "/pvz botanic test.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Douchix111 Studios",
          productName: "PvZ Botanic Warfare",
          productVersion: "0.2.1 Alpha",
          showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.getElementsByTagName('head')[0].appendChild(meta);
        }

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
          createUnityInstance(canvas, config, function(progress) {
            // Unity's own load progress occupies the remaining 50–100 % of the bar.
            progressBarFull.style.width = (50 + 50 * progress) + "%";
          }).then(function(unityInstance) {
            loadingBar.style.display = "none";
            // Release the object URL now that Unity has consumed it.
            URL.revokeObjectURL(mergedDataUrl);
          }).catch(function(message) {
            alert(message);
          });
        };
        document.body.appendChild(script);

      }).catch(function(err) {
        unityShowBanner("Failed to load game data: " + err.message, "error");
      });
    </script>
  </body>
</html>
